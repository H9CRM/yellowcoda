name: Deploy YellowCada to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v6
      - name: Install locked dependencies
        run: npm ci
      - name: Lint source
        run: npm run lint
      - name: Build readable static HTML and verify output
        run: |
          npm run build
          npm run check:html
        env:
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_STATIC_HOSTING: 'true'
      - name: Upload built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
